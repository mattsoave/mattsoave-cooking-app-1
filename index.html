<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cookbook Recipe Finder</title>
  <meta name="theme-color" content="#9c4221" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <style>
    :root {
      --bg: #faf7f2;
      --surface: #ffffff;
      --surface-2: #f3ece1;
      --text: #2b211a;
      --muted: #6f6256;
      --border: #e4d9c9;
      --accent: #9c4221;
      --accent-text: #ffffff;
      --shadow: 0 1px 2px rgba(43, 33, 26, 0.08), 0 2px 8px rgba(43, 33, 26, 0.05);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1715;
        --surface: #241f1b;
        --surface-2: #2e2823;
        --text: #f1e9df;
        --muted: #b3a595;
        --border: #3a322b;
        --accent: #e0905f;
        --accent-text: #1a1715;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.25);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      padding: max(16px, env(safe-area-inset-top)) 16px 10px;
      border-bottom: 1px solid var(--border);
    }
    .title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    h1 { font-size: 1.15rem; margin: 0; font-weight: 650; }
    .version { font-size: 0.72rem; color: var(--muted); }
    .search-wrap { position: relative; }
    #search {
      width: 100%;
      font-size: 1rem;
      padding: 12px 40px 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      outline: none;
    }
    #search:focus { border-color: var(--accent); }
    #clear {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 1.3rem;
      line-height: 1;
      padding: 6px 8px;
      cursor: pointer;
      display: none;
    }
    .kw-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 0.82rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .kw-toggle input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
    main { padding: 12px 16px 40px; max-width: 680px; margin: 0 auto; }
    .meta { font-size: 0.8rem; color: var(--muted); margin: 4px 2px 12px; }
    ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    li.recipe {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: var(--shadow);
    }
    .recipe-title { font-weight: 600; font-size: 1rem; }
    .recipe-sub { font-size: 0.85rem; color: var(--muted); margin-top: 3px; }
    .recipe-sub .cookbook { color: var(--text); }
    .recipe-kw { font-size: 0.78rem; color: var(--accent); margin-top: 4px; }
    .page-pill {
      display: inline-block;
      background: var(--surface-2);
      color: var(--text);
      border-radius: 999px;
      padding: 1px 9px;
      font-size: 0.78rem;
      margin-left: 2px;
    }
    mark { background: rgba(156, 66, 33, 0.22); color: inherit; border-radius: 3px; padding: 0 1px; }
    @media (prefers-color-scheme: dark) { mark { background: rgba(224, 144, 95, 0.28); } }
    .empty { color: var(--muted); text-align: center; padding: 40px 10px; }
    .empty.hint { padding: 28px 10px; }
  </style>
</head>
<body>
  <header>
    <div class="title-row">
      <h1>Cookbook Recipe Finder</h1>
      <span class="version" id="version"></span>
    </div>
    <div class="search-wrap">
      <input id="search" type="search" inputmode="search" autocomplete="off"
             placeholder="Search recipe titles&hellip;" aria-label="Search recipe titles" />
      <button id="clear" aria-label="Clear search">&times;</button>
    </div>
    <label class="kw-toggle">
      <input type="checkbox" id="kw-toggle" />
      <span>Also search ingredients &amp; categories</span>
    </label>
  </header>
  <main>
    <div class="meta" id="meta"></div>
    <ul id="results"></ul>
    <div class="empty hint" id="hint">Type a keyword to find which cookbook a recipe is in.</div>
  </main>

  <script src="./search.js"></script>
  <script src="./app.js"></script>
</body>
</html>
